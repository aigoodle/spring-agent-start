version: "3.9"

# Standalone PostgreSQL for spring-agent-start dev / demo use. Run
#   docker-compose -f pgsql/docker-compose.yml up -d
# and start the app with `--spring.profiles.active=postgres`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-start-postgres
    restart: unless-stopped
    environment:
      # Match the defaults in agent-start-server/application.yml so the app can
      # connect without any override envs.
      POSTGRES_DB: spring-agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: difyai123456
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-boot init: creates every table on an empty DB. Idempotent — safe on re-run.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spring-agent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
