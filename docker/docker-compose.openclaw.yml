services:
  openclaw:
    build:
      context: ..
      dockerfile: openclaw/Dockerfile
    container_name: agent-start-openclaw
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-demo-openclaw-gateway-token-change-me}
      AGENT_START_BRIDGE_TOKEN: ${OPENCLAW_SERVICE_TOKEN:-demo-openclaw-bridge-token-change-me}
      AGENT_START_RUNTIME_NODE_ID: ${OPENCLAW_RUNTIME_NODE_ID:-openclaw-default}
      OPENCLAW_ALLOW_INSTALL: ${OPENCLAW_ALLOW_INSTALL:-false}
      AGENT_START_EVENT_SINK_URL: ${AGENT_START_EVENT_SINK_URL:-http://backend:18090/agent-start/channel-events/openclaw}
    volumes:
      - ./volumes/openclaw:/var/lib/openclaw
    ports:
      - "18789:18789"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18789/agent-start-bridge/v1/health',{headers:{'X-Agent-Start-Token':process.env.AGENT_START_BRIDGE_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    depends_on:
      openclaw:
        condition: service_healthy
    environment:
      OPENCLAW_ENABLED: "true"
      OPENCLAW_BASE_URL: http://openclaw:18789
      OPENCLAW_SERVICE_TOKEN: ${OPENCLAW_SERVICE_TOKEN:-demo-openclaw-bridge-token-change-me}
