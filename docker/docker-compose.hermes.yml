# Hermes runtime overlay for the Agent Start demo stack.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.hermes.yml up -d --build
services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: agent-start-hermes
    command: ["gateway", "run"]
    restart: unless-stopped
    environment:
      # Match the local developer by default so bind-mounted files stay readable.
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_DASHBOARD: "1"
      # Keep the unauthenticated management service on container loopback.
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_PORT: "9119"
      API_SERVER_ENABLED: ${HERMES_API_SERVER_ENABLED:-false}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_START_BRIDGE_URL: http://backend:18090/agent-start/channel-events/hermes
      AGENT_START_BRIDGE_TOKEN: ${HERMES_BRIDGE_TOKEN:-demo-hermes-bridge-token-change-me}
      AGENT_START_RUNTIME_NODE_ID: ${HERMES_RUNTIME_NODE_ID:-hermes-default}
      AGENT_START_BRIDGE_SOCKET_DIR: /opt/data/agent-start-bridge
    volumes:
      - ./volumes/hermes:/opt/data
      - ./hermes/agent-start-bridge:/opt/data/plugins/agent-start-bridge:ro
    # Port 9120 is the private sidecar forwarder; host access remains localhost-only.
    ports:
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9120"
      - "127.0.0.1:${HERMES_API_PORT:-8642}:8642"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9120/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEMORY_LIMIT:-4G}
          cpus: "${HERMES_CPU_LIMIT:-2.0}"

  hermes-dashboard-proxy:
    image: nginx:1.27-alpine
    container_name: agent-start-hermes-dashboard-proxy
    network_mode: "service:hermes"
    depends_on:
      hermes:
        condition: service_started
    volumes:
      - ./hermes/dashboard-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  hermes-agent-start-bridge:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: agent-start-hermes-bridge
    entrypoint: ["/opt/hermes/.venv/bin/python3"]
    command: ["/opt/data/plugins/agent-start-bridge/router.py"]
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    init: true
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_started
    environment:
      HERMES_HOME: /opt/data
      AGENT_START_BRIDGE_TOKEN: ${HERMES_BRIDGE_TOKEN:-demo-hermes-bridge-token-change-me}
      AGENT_START_BRIDGE_SOCKET_DIR: /opt/data/agent-start-bridge
      AGENT_START_BRIDGE_PORT: "9121"
    volumes:
      - ./volumes/hermes:/opt/data
      - ./hermes/agent-start-bridge:/opt/data/plugins/agent-start-bridge:ro
    ports:
      - "127.0.0.1:${HERMES_BRIDGE_PORT:-9121}:9121"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/hermes/.venv/bin/python3 -c "import os,urllib.request;
          r=urllib.request.Request('http://127.0.0.1:9121/health',headers={'X-Agent-Start-Token':os.environ['AGENT_START_BRIDGE_TOKEN']});
          urllib.request.urlopen(r,timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    depends_on:
      hermes:
        condition: service_healthy
      hermes-agent-start-bridge:
        condition: service_healthy
    environment:
      HERMES_ENABLED: "true"
      HERMES_BASE_URL: http://hermes:9120
      HERMES_API_TOKEN: ${HERMES_API_TOKEN:-}
      HERMES_TIMEOUT: ${HERMES_TIMEOUT:-15s}
      HERMES_BRIDGE_BASE_URL: http://hermes-agent-start-bridge:9121
      HERMES_BRIDGE_TOKEN: ${HERMES_BRIDGE_TOKEN:-demo-hermes-bridge-token-change-me}
